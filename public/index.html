<!doctype html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kirana Market</title><link rel="stylesheet" href="/style.css"></head><body><div id="startup" class="startup"><div class="startup-card"><div id="startupLogo" class="startup-logo">🛒</div><h1 id="startupName">Kirana Market</h1><p id="startupWelcome">Welcome</p><div class="loader"></div></div></div><header class="topbar"><div class="brand" id="brand">🛒 Kirana Market</div><a class="admin-link" href="/admin/">Admin</a></header><main class="container"><section class="hero"><h1 id="welcomeTitle">Fresh groceries. Easy shopping.</h1><p>Search products, scan or shop, and order from home.</p></section><section id="offers" class="offers"></section><section class="toolbar"><input id="search" placeholder="🔍 Search products or barcode..."><select id="category"><option>All</option></select></section><section id="products" class="grid"></section><section class="cart-box"><h2>🛒 Your Cart</h2><div id="cart"></div><div class="cart-total">Total: ₹<span id="total">0.00</span></div><button id="checkoutBtn" class="primary">Place Order</button></section><section id="checkout" class="checkout hidden"><h2>Customer Details</h2><form id="orderForm"><input id="customerName" placeholder="Full name" required><input id="phone" placeholder="Mobile number" required><textarea id="address" placeholder="Delivery address" required></textarea><button class="primary">Confirm Order</button><button type="button" id="cancelCheckout">Cancel</button></form><p id="orderMessage"></p></section><section class="panel feedback-panel"><h2>💬 Feedback</h2><form id="feedbackForm" class="form-grid"><input id="fbName" placeholder="Your name"><input id="fbPhone" placeholder="Phone"><textarea id="fbMessage" placeholder="Tell us about your experience" required></textarea><button class="primary">Send Feedback</button></form></section></main><div id="ratingModal" class="modal hidden"><div class="modal-card"><button class="close" onclick="closeRating()">×</button><h2>⭐ Rate Product</h2><div id="ratingProduct"></div><form id="ratingForm"><div id="stars" class="stars">★★★★★</div><input id="ratingName" placeholder="Your name"><textarea id="ratingComment" placeholder="Optional comment"></textarea><button class="primary">Submit Rating</button></form></div></div><div id="celebrate" class="celebrate hidden"></div><script src="/app.js"></script></body></html>
